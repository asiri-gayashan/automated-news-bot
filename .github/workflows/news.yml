name: Render & publish news posts

on:
  # PAUSED on 2026-11-18 (Meta blocked the app). To resume automatic runs, restore:
  # push:
  #   branches: [main]
  #   paths: ["queue/**"]
  workflow_dispatch:

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new: ${{ steps.render.outputs.new }}
      posts: ${{ steps.render.outputs.posts }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer (Chromium + ffmpeg)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Unpack licensed font from secret
        env:
          AMERICAN_CAPTAIN_OTF_B64: ${{ secrets.AMERICAN_CAPTAIN_OTF_B64 }}
        run: |
          if [ -z "$AMERICAN_CAPTAIN_OTF_B64" ]; then echo "::error::Secret AMERICAN_CAPTAIN_OTF_B64 is missing"; exit 1; fi
          echo "$AMERICAN_CAPTAIN_OTF_B64" | base64 -d > engine/fonts/AmericanCaptain.otf

      - name: Render queued posts
        id: render
        run: python scripts/render_queue.py

      - name: Copy media to automated-news-posts
        if: steps.render.outputs.new != '0'
        env:
          TOKEN: ${{ secrets.POSTS_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Secret POSTS_REPO_TOKEN is missing"; exit 1; fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/asiri-gayashan/automated-news-posts.git" posts-repo
          mkdir -p posts-repo/posts && cp -r out/posts/* posts-repo/posts/
          cd posts-repo
          git config user.name "news-bot" && git config user.email "news-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet && echo "media already up to date" || (git commit -m "New posts $(date -u +%F' '%H:%M)" && git push)

      - name: Save render status
        if: always()
        run: |
          git config user.name "news-bot" && git config user.email "news-bot@users.noreply.github.com"
          git add queue/*/*/status.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Render status [skip ci]" && git pull --rebase -q && git push)

  publish:
    needs: render
    if: needs.render.outputs.new != '0'
    runs-on: ubuntu-latest
    # Fully automatic: no approval step. To require approval again, add back:  environment: approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to Facebook + Instagram
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          ONLY_POSTS: ${{ needs.render.outputs.posts }}
        run: python scripts/publish_meta.py

      - name: Save publish status
        if: always()
        run: |
          git config user.name "news-bot" && git config user.email "news-bot@users.noreply.github.com"
          git add queue/*/*/status.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Publish status [skip ci]" && git pull --rebase -q && git push)
